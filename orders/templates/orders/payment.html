{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm p-4 text-center">

    <h2 class="mb-3">Pago 💳</h2>

    <p><strong>Pedido:</strong> #{{ order.id }}</p>
    <p><strong>Total:</strong> ${{ order.total }}</p>

    {% if order.estado == 'cancelado' %}
        <div class="alert alert-danger">
            El pago fue rechazado ❌ Intenta nuevamente.
        </div>
    {% endif %}

    <form method="POST" action="{% url 'payment_confirm' order.id %}" class="mt-3">
        {% csrf_token %}

        <button class="btn btn-success me-2" name="resultado" value="aprobado">
            Pagar 💳
        </button>

        <button class="btn btn-danger" name="resultado" value="rechazado">
            Simular rechazo ❌
        </button>
    </form>

</div>

{% endblock %}
