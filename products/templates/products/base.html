<!DOCTYPE html>
<html>
<head>
    <title>RefSur</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'product_list' %}">RefSur</a>

    <div>
        <a class="btn btn-outline-light me-2" href="{% url 'view_cart' %}">
            Carrito 🛒
        </a>

        <a class="btn btn-outline-light me-2" href="{% url 'my_orders' %}">
            Pedidos 📦
        </a>

        {% if user.is_authenticated %}
            <span class="text-white me-2">Hola, {{ user.username }}</span>
            <a class="btn btn-danger" href="{% url 'logout' %}">Salir</a>
        {% else %}
            <a class="btn btn-success" href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>
  </div>
</nav>


<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>


<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
