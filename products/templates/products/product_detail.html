{% extends 'base.html' %}

{% block content %}

<h1>{{ producto.nombre }}</h1>

<p>{{ producto.descripcion }}</p>
<p><strong>$ {{ producto.precio }}</strong></p>

<form method="POST" action="{% url 'add_to_cart' producto.id %}">
    {% csrf_token %}
    <button class="btn btn-primary">Agregar al carrito</button>
</form>

{% endblock %}
