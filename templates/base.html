<!DOCTYPE html>
<html>
<head>
    <title>RefSur - Tienda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.3rem;
        }

        .card {
            border-radius: 12px;
        }

        .card-title a {
            text-decoration: none;
            color: #212529;
        }

        .card-title a:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="{% url 'product_list' %}">
        🏡 RefSur
    </a>

    <div class="d-flex align-items-center">

        {% if user.is_authenticated %}

            <a class="btn btn-outline-light me-2" href="{% url 'view_cart' %}">
                🛒 Carrito
            </a>

            <a class="btn btn-outline-light me-2" href="{% url 'my_orders' %}">
                📦 Pedidos
            </a>
            
            <a class="btn btn-outline-light me-2" href="{% url 'profile' %}">
                👤 Perfil
            </a>

            <span class="text-white me-3">
                Hola, {{ user.first_name|default:user.username }}
            </span>

            <a class="btn btn-danger" href="{% url 'logout' %}">
                Salir
            </a>

        {% else %}

            <a class="btn btn-success" href="{% url 'login' %}">
                Login
            </a>

        {% endif %}
    </div>
  </div>
</nav>

<!-- MENSAJES -->
<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
